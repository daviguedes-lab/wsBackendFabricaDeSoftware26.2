
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Pizzaria{% endblock %}</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background: #f7f7f7;
            color: #333;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #b71c1c;
            color: white;
            padding: 18px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .logo {
            margin: 0;
            font-size: 26px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            transition: 0.2s;
            font-weight: 500;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* =========================
           CONTEÚDO
        ========================= */

        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 25px;
            min-height: 70vh;
        }

        h1, h2, h3 {
            color: #222;
        }

        /* =========================
           BOTÕES
        ========================= */

        .btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 7px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-primary {
            background: #d32f2f;
            color: white;
        }

        .btn-primary:hover {
            background: #b71c1c;
        }

        .btn-secondary {
            background: #eeeeee;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dddddd;
        }

        .btn-danger {
            background: #c62828;
            color: white;
        }

        .btn-danger:hover {
            background: #8e0000;
        }

        /* =========================
           CARDS
        ========================= */

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        /* =========================
           FORMULÁRIOS
        ========================= */

        form {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            max-width: 650px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            margin-bottom: 18px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #d32f2f;
        }

        /* =========================
           PIZZAS
        ========================= */

        .pizza-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }

        .pizza-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            transition: 0.2s;
        }

        .pizza-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .pizza-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .pizza-info {
            padding: 18px;
        }

        .pizza-info h3 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .pizza-price {
            color: #d32f2f;
            font-size: 20px;
            font-weight: bold;
            margin: 12px 0;
        }

        .pizza-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            main {
                margin-top: 25px;
            }
        }

    </style>
</head>

<body>

    <header>

        <h1 class="logo">
            🍕 Pizzaria
        </h1>

        <nav>
            <a href="/">Início</a>
            <a href="/pizzas/">Pizzas</a>
            <a href="{% url 'lista_categorias' %}">Categorias</a>
            <a href="{% url 'consultar_cep' %}">Consultar CEP</a>
        </nav>

    </header>

    <main>

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
