{% extends 'base.html' %}

{% block title %}Editar Categoria - Pizzaria{% endblock %}

{% block content %}

<div class="form-card">

    <h2>✏️ Editar Categoria</h2>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label for="nome">Nome da categoria</label>

            <input
                type="text"
                id="nome"
                name="nome"
                value="{{ categoria.nome }}"
                required
            >

        </div>

        <div class="form-group">

            <label for="descricao">Descrição</label>

            <textarea
                id="descricao"
                name="descricao"
                rows="5"
                required
            >{{ categoria.descricao }}</textarea>

        </div>

        <div class="actions">

            <button type="submit" class="btn btn-primary">
                💾 Salvar Alterações
            </button>

            <a href="{% url 'lista_categorias' %}" class="btn btn-secondary">
                ↩️ Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
